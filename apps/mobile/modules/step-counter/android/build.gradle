plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'bo.camina.stepcounter'
version = '1.0.0'

android {
  namespace "expo.modules.stepcounter"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Tarea periódica que anota el contador de pasos aunque Camina esté cerrada.
  implementation "androidx.work:work-runtime-ktx:2.9.1"
}
